<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7ff" />
    <meta name="description" content="Prova Codex: un semplice contatore persistente." />
    <title>Prova Codex</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="counter-card" aria-labelledby="page-title">
        <div class="brand" aria-label="Prova Codex">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Prova Codex</span>
        </div>

        <div class="content">
          <p class="eyebrow">Il tuo contatore personale</p>
          <h1 id="page-title">La mia prima app con Codex</h1>
          <p class="intro">Un piccolo passo alla volta. Il tuo progresso resta salvato su questo dispositivo.</p>

          <div class="counter" aria-live="polite" aria-atomic="true">
            <span class="counter-label">Valore attuale</span>
            <strong id="counter-value">0</strong>
          </div>

          <div class="actions">
            <button id="increment-button" class="button button-primary" type="button">
              <span aria-hidden="true">+</span>1
            </button>
            <button id="reset-button" class="button button-secondary" type="button">Azzera</button>
          </div>
        </div>

        <p class="storage-note">
          <span aria-hidden="true">✓</span>
          Salvataggio automatico attivo
        </p>
      </section>
    </main>
  </body>
</html>
